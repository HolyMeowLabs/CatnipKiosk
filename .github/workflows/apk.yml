name: Build APKs

# Run by hand from the Actions tab ("Run workflow"). Produces APKs to download and install
# for testing. The release APK is built only when the signing secrets are set (see README).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CatnipKiosk
    env:
      HAS_RELEASE_KEY: ${{ secrets.CATNIP_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: catnipkiosk-debug-${{ github.sha }}
          path: CatnipKiosk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build signed release APK
        if: env.HAS_RELEASE_KEY == 'true'
        env:
          CATNIP_KEYSTORE_BASE64: ${{ secrets.CATNIP_KEYSTORE_BASE64 }}
          CATNIP_KEYSTORE_PASSWORD: ${{ secrets.CATNIP_KEYSTORE_PASSWORD }}
          CATNIP_KEY_ALIAS: ${{ secrets.CATNIP_KEY_ALIAS }}
          CATNIP_KEY_PASSWORD: ${{ secrets.CATNIP_KEY_PASSWORD }}
        run: |
          export CATNIP_KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$CATNIP_KEYSTORE_BASE64" | base64 --decode > "$CATNIP_KEYSTORE"
          ./gradlew assembleRelease
          rm -f "$CATNIP_KEYSTORE"

      - name: Upload release APK
        if: env.HAS_RELEASE_KEY == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: catnipkiosk-release-${{ github.sha }}
          path: CatnipKiosk/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
